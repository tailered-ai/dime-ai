# CI perf harness — real-browser load + weight budgets against the live deploy.
#
# Loads a set of routes on the deployed Railway app with headless Chromium,
# measures TTFB / DCL / load / FCP / LCP / transfer weight, and enforces perf
# budgets + a regression guard (perf/baseline.json). Fails the run on any
# violation so a slow deploy is caught. See perf/README.md.
#
# Required repo variable / secret:
#   RAILWAY_APP_URL (var)          — public Cloudflare-fronted app URL, no trailing slash.
#   EDGE_AGENT_BYPASS_KEY (secret) — trusted-agent bypass so headless document-route
#     loads are waved past the armed edge's Super Bot Fight Mode; without it the
#     harness would score a 403 bot-block page (see perf/harness.ts). The job binds
#     environment:Production, satisfying the repo GHA security contract for secrets.
#
# Manual + scheduled. workflow_dispatch exposes `update_baseline` to generate a
# reviewable candidate artifact; the committed baseline changes only through PR.
name: Perf harness

on:
  workflow_dispatch:
    inputs:
      update_baseline:
        description: "Generate a reviewable baseline candidate instead of gating"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
  schedule:
    - cron: "0 12 * * *" # daily 12:00 UTC

permissions:
  contents: read

concurrency:
  group: perf-harness
  cancel-in-progress: true

jobs:
  measure:
    name: Measure live routes
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: "[INPUT] Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: "[STEP] Preflight — RAILWAY_APP_URL present"
        env:
          RAILWAY_APP_URL: ${{ vars.RAILWAY_APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_APP_URL:-}" ]; then
            echo "::error::RAILWAY_APP_URL secret is not set"; exit 1
          fi
          echo "[PREFLIGHT] target secret present"

      - name: "[STEP] Setup pnpm"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: "[STEP] Setup Node.js 22"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: "[STEP] Install dependencies (frozen lockfile)"
        run: pnpm install --frozen-lockfile

      - name: "[STEP] Install Chromium for Playwright"
        run: pnpm exec playwright install --with-deps chromium

      - name: "[VERIFY] Run focused real-browser harness tests"
        run: pnpm exec vitest run perf/harness.smoke.test.ts --reporter=verbose

      - name: "[STEP] Run perf harness"
        env:
          PERF_TARGET_URL: ${{ vars.RAILWAY_APP_URL }}
          # Trusted-agent bypass: waves the headless browser past the armed edge's
          # Super Bot Fight Mode on document routes. Stays in GitHub; host-scoped to
          # the target origin by perf/harness.ts (never leaks to third parties).
          EDGE_AGENT_BYPASS_KEY: ${{ secrets.EDGE_AGENT_BYPASS_KEY }}
          UPDATE_BASELINE: ${{ github.event.inputs.update_baseline }}
        run: |
          set -euo pipefail
          if [ "$UPDATE_BASELINE" = "true" ]; then
            pnpm exec tsx perf/harness.ts --update-baseline
          else
            pnpm exec tsx perf/harness.ts
          fi

      - name: "[OUTPUT] Upload raw metrics artifact"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: perf-results
          path: perf-results.json
          if-no-files-found: ignore

      - name: "[OUTPUT] Upload reviewable baseline candidate"
        if: ${{ success() && github.event_name == 'workflow_dispatch' && github.event.inputs.update_baseline == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: perf-baseline-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            perf-baseline-candidate.json
            perf-results.json
          if-no-files-found: error
          retention-days: 30
