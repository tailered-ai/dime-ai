# 05-workflow-security — zizmor over every workflow, SARIF uploaded, blocking
# on high-severity findings (untrusted-input interpolation, unpinned actions,
# excessive GITHUB_TOKEN permissions, vulnerable constructs). Complements the
# repo's own scripts/check-github-actions-security.mjs gate (pinning +
# permissions + secret-ref audit), which stays required in ci.yml.
name: 05-workflow-security

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIZMOR_VERSION: "1.29.0" # pinned; bump deliberately

jobs:
  zizmor:
    name: 05-workflow-security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Install pinned zizmor
        run: pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: "zizmor — SARIF for the security tab (reporting, NOT the verdict)"
        run: |
          # SARIF mode exits 0 EVEN WITH findings present (measured, zizmor
          # 1.29.0): this step reports, it does not decide. A scanner crash
          # still exits non-zero here, so scan failure fails the job.
          zizmor --min-severity high --format sarif .github/workflows/ > zizmor.sarif

      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor

      - name: "[GATE] zizmor — ENFORCEMENT: any finding at or above the threshold fails"
        run: |
          # THE VERDICT. Plain mode exits 14 when findings >= --min-severity
          # exist and non-zero when the scan itself fails, so this step is the
          # fail-closed boundary. Same scope and threshold as the SARIF run
          # above; the scanner's own severity semantics decide, and no policy
          # is reimplemented here. Runs last so the SARIF is always uploaded
          # first, and its status is captured directly — never through a pipe.
          #
          # DEF-023: this gate previously ran ONLY the SARIF form and was
          # therefore green regardless of findings.
          zizmor --min-severity high --format plain .github/workflows/
