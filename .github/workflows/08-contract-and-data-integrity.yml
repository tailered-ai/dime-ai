# 08-contract-and-data-integrity — migration, schema, and governed-data gates.
#
# Adapted per docs/verification/AUDIT.md: no Protobuf/OpenAPI/Pact surfaces
# (tRPC contracts are compile-time, enforced by tsc + contract tests). The
# repo's bespoke reconciled-migration system replaces Atlas — its journal
# integrity, meta hygiene (consumer-pinned snapshots), and the destructive-SQL
# lint below are the migration gates; the full chain REPLAY runs in ci.yml's
# "DB Tests" against an isolated database. AI-surface manifests (checksums,
# contamination, record counts) are enforced by dime-llm-validation.yml on
# ml/** changes; this job re-verifies the manifest checksums cheaply on every
# PR so drift in the pinned repo-side artifacts (the 2026-08-05 closure
# incident class) surfaces immediately, not on the next ml/ touch.
#
# The federation-docs gate (added 2026-08-07) is the same class one layer up: the
# design/engineering federation skills are a contract between the docs an agent loads
# and the repo they describe, and a 2026-08-07 review found four recurring ways they
# drift — dangling paths, ordinal citations of a smoke-check list that renumbers,
# evidence-record fields renamed away from the vendored standard, and routing rows
# advertising skills the Skill tool cannot invoke. scripts/check-federation-docs.mjs
# asserts all four; see its header for why each one earned a rule.
name: 08-contract-and-data-integrity

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: 08-contract-and-data-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: "[GATE] Destructive migration lint — new SQL dropping data needs a plan file"
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          BASE="origin/${BASE_BRANCH}"
          NEW_SQL=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- 'drizzle/*.sql' || true)
          [ -z "$NEW_SQL" ] && { echo "no new migrations"; exit 0; }
          FAIL=0
          for f in $NEW_SQL; do
            if grep -inE '^\s*(DROP\s+TABLE|DROP\s+COLUMN|TRUNCATE)|ALTER\s+TABLE\s+\S+\s+DROP\s' "$f"; then
              PLAN="docs/verification/migration-plans/$(basename "$f" .sql).md"
              if [ ! -f "$PLAN" ]; then
                echo "::error file=$f::destructive statement without approved plan $PLAN"
                FAIL=1
              fi
            fi
          done
          exit $FAIL

      - name: "[GATE] Migration journal + meta hygiene + dockerignore build-context"
        run: |
          npx vitest run scripts/migration-journal-integrity.test.ts \
            scripts/drizzle-meta-hygiene.test.ts \
            scripts/dockerignore-build-context.test.ts

      - name: "[GATE] Immutable-migration check — history files must never be edited"
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          BASE="origin/${BASE_BRANCH}"
          MODIFIED=$(git diff --name-only --diff-filter=MD "$BASE"...HEAD -- 'drizzle/*.sql' || true)
          if [ -n "$MODIFIED" ]; then
            echo "::error::applied migration files modified or deleted: $MODIFIED"
            exit 1
          fi

      - name: "[GATE] AI-surface governed manifests — repo-side checksum re-verify"
        run: |
          python3 - <<'EOF'
          import hashlib, json, sys
          from pathlib import Path
          root = Path("ml/dime-1.0/evidence/manifests/phase1-observability-closure-v1")
          closure = json.loads((root / "closure.json").read_text())
          bad, notes = [], []
          for e in closure["evidence"]:
              p = Path(e["artifact"])
              inside_ml = e["artifact"].startswith("ml/")
              if not p.is_file():
                  # A missing artifact breaks the closure regardless of tree.
                  bad.append(f"MISSING {e['artifact']}"); continue
              h = hashlib.sha256(p.read_bytes()).hexdigest()
              if h != e["sha256"]:
                  if inside_ml:
                      # Governed evidence tree is immutable — drift blocks.
                      bad.append(
                          f"DRIFT {e['artifact']} pinned={e['sha256'][:12]} actual={h[:12]}"
                      )
                  else:
                      # Out-of-tree artifacts (drizzle/schema.ts, server tests,
                      # package.json) are POINT-IN-TIME references: the closure
                      # proves what they were when the evidence was frozen, but
                      # they legitimately evolve (2026-08-05: #370's lockout
                      # migration changed drizzle/schema.ts and correctly so —
                      # schema rides db-push law, not evidence law). Drift here
                      # is informational; existence stays mandatory.
                      notes.append(
                          f"note: out-of-tree reference evolved since closure: "
                          f"{e['artifact']} pinned={e['sha256'][:12]} actual={h[:12]}"
                      )
          for line in (root / "SHA256SUMS").read_text().splitlines():
              digest, rel = line.split("  ", 1)
              h = hashlib.sha256((root / rel).read_bytes()).hexdigest()
              if h != digest:
                  bad.append(f"SUMS-DRIFT {rel}")
          for n in notes:
              print(n)
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print(f"{len(closure['evidence'])} evidence pins verified "
                f"({len(notes)} out-of-tree references noted) + SHA256SUMS verified")
          EOF

      - name: "[GATE] Platform-knowledge catalog integrity (runtime prompt hash source)"
        run: npx vitest run server/_core/dimePlatformKnowledge.test.ts

      # The federation skills are always-loaded routing documents — an agent acts on
      # them without re-deriving their claims, so a stale line there is executed, not
      # merely read. Pure file reads, no network, ~50ms.
      - name: "[GATE] Federation docs — no dangling paths, ordinals, schema drift, or dead routing"
        run: |
          node scripts/check-federation-docs.mjs
          npx vitest run scripts/check-federation-docs.test.ts
