name: Publish NCAAF Week 1

on:
  workflow_dispatch:
    inputs:
      slate:
        description: Exact authorized slate
        required: true
        default: september-3
        type: choice
        options:
          - september-3
          - sjsu-emu
          - september-4-five
          - september-4-dk
          - september-5-dk-model
          - september-5-okst-correction
          - september-6-dk
      dry_run:
        description: Fetch and validate without writing TiDB
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-ncaaf-week1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Publish selected exact slate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PUBLISH_SLATE: ${{ inputs.slate }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$PUBLISH_SLATE" = "sjsu-emu" ] || [ "$PUBLISH_SLATE" = "september-4-five" ] || [ "$PUBLISH_SLATE" = "september-4-dk" ]; then
            slate_args=()
            if [ "$PUBLISH_SLATE" = "september-4-five" ] || [ "$PUBLISH_SLATE" = "september-4-dk" ]; then
              slate_args+=(--slate=september-4-five)
            fi
            if [ "$PUBLISH_SLATE" = "september-4-dk" ]; then
              slate_args+=(--source=vsin-dk)
            fi
            pnpm exec tsx scripts/publishSjsuEmu.mts "${slate_args[@]}" --check
            if [ "$DRY_RUN" = "true" ]; then
              pnpm exec tsx scripts/publishSjsuEmu.mts "${slate_args[@]}" --dry-run
            else
              pnpm exec tsx scripts/publishSjsuEmu.mts "${slate_args[@]}" --publish
              pnpm exec tsx scripts/publishSjsuEmu.mts "${slate_args[@]}" --verify
            fi
          elif [ "$PUBLISH_SLATE" = "september-5-okst-correction" ]; then
            pnpm exec tsx scripts/correctNcaafSeptember5Okst.mts --check
            if [ "$DRY_RUN" = "true" ]; then
              pnpm exec tsx scripts/correctNcaafSeptember5Okst.mts --dry-run
            else
              pnpm exec tsx scripts/correctNcaafSeptember5Okst.mts --apply
              pnpm exec tsx scripts/correctNcaafSeptember5Okst.mts --verify
            fi
          elif [ "$PUBLISH_SLATE" = "september-5-dk-model" ]; then
            pnpm exec tsx scripts/publishNcaafSeptember5.mts --check
            if [ "$DRY_RUN" = "true" ]; then
              pnpm exec tsx scripts/publishNcaafSeptember5.mts --dry-run
            else
              pnpm exec tsx scripts/publishNcaafSeptember5.mts --publish
              pnpm exec tsx scripts/publishNcaafSeptember5.mts --verify
            fi
          elif [ "$PUBLISH_SLATE" = "september-6-dk" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              pnpm exec tsx scripts/publishNcaafSeptember6.mts --dry-run
            else
              pnpm exec tsx scripts/publishNcaafSeptember6.mts --publish
            fi
          elif [ "$PUBLISH_SLATE" = "september-3" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              pnpm exec tsx scripts/publishNcaafWeek1.mts --dry-run
            else
              pnpm exec tsx scripts/publishNcaafWeek1.mts
            fi
          else
            echo "Unsupported slate" >&2
            exit 1
          fi
