name: Seed NFL 2026

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Existing NFL corpus or Week 1 AI Model Projections Feed"
        type: choice
        options: [corpus, feed-week1]
        default: corpus
      dry_run:
        description: "Validate seed files without writing to the database"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nfl-2026-seed-single-writer
  cancel-in-progress: false

jobs:
  seed-nfl:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Version comes from package.json's "packageManager" field — specifying
      # it here too makes pnpm/action-setup fail with a version conflict.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed NFL 2026 data
        run: pnpm exec tsx scripts/seedNfl2026.mts ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.target == 'feed-week1' && '--feed-week1' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
