# 14-prx-communication — PRX v1.1 commit-and-PR communication profile.
#
# AUDIT MODE ONLY (scripts/prx/prx-mode.json, read from the TRUSTED policy
# tree): this lane reports and never blocks. It is NOT in the required-check
# list; graduation follows docs/verification/ROLLOUT.md and is an owner
# ruleset action after independent review.
#
# HARD GRADUATION BLOCKER (remediation R6): PRX must not enter enforcing
# mode and must not become a required status check while the pull-request
# head controls this workflow file (GitHub runs it from the head on
# pull_request events). Graduation requires a separately reviewed
# base-controlled orchestration mechanism first — see threat-model.md A4.
#
# Trusted boundary (SOL-PRX-004, threat model at
# docs/verification/prx/threat-model.md): policy code that produces the
# verdict is checked out from the event's BASE SHA into ./base and executed
# from there. The head checkout is DATA (commit messages, body, title) only.
# Bootstrap honesty: until PRX lands on main, ./base has no policy and the
# lane runs the head copy explicitly labeled UNTRUSTED, still audit-only.
# pull_request_target is never used. Event text reaches shells only via env.
name: 14-prx-communication

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prx-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prx-audit:
    name: 14-prx-communication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        # Explicit `bash` = `bash -eo pipefail`; the platform default omits
        # pipefail, which let a checker crash vanish behind `| tee` as a
        # silently green step (review finding). Crash = red; findings still
        # exit 0 in audit mode via the checkers' own mode law.
        shell: bash
    steps:
      - name: "[DATA] Checkout head (untrusted: judged, never executed)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: "[POLICY] Checkout the event base SHA (trusted)"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      # This step MIRRORS scripts/prx/policy-source.mjs (the tested
      # reference implementation of the selection contract). It cannot call
      # that module: selection decides WHICH tree's modules are trusted, so
      # importing either copy before selecting would beg the question.
      - name: "[BOUNDARY] Select policy source (bootstrap-aware)"
        id: policy
        run: |
          if [ -f base/scripts/prx/check-commit.mjs ]; then
            echo "dir=base" >> "$GITHUB_OUTPUT"
            echo "TRUST=trusted (base ref)" >> "$GITHUB_ENV"
          else
            echo "dir=head" >> "$GITHUB_OUTPUT"
            echo "TRUST=UNTRUSTED (bootstrap: policy absent on base)" >> "$GITHUB_ENV"
            echo "::notice::PRX bootstrap mode: policy is not on the base ref yet; running the head copy UNTRUSTED, audit-only."
          fi

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
        with:
          # Both checkouts are pathed, so the workspace root has no
          # package.json; resolve the pnpm version from the POLICY tree's
          # packageManager pin (review finding: without this the action
          # fails on every run).
          package_json_file: ${{ steps.policy.outputs.dir }}/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ steps.policy.outputs.dir }}/pnpm-lock.yaml

      # --ignore-scripts (remediation R7): during the explicitly UNTRUSTED
      # bootstrap the policy tree IS the head, so dependency lifecycle
      # scripts must never execute. Kept on in trusted mode too — the lane
      # only needs modules resolvable, never install-time code execution.
      # No secrets exist in this job; the bootstrap result proves
      # operability only. Regression: scripts/prx/bootstrap-install.test.ts.
      - name: "[POLICY] Frozen install, lifecycle scripts disabled"
        env:
          POLICY: ${{ steps.policy.outputs.dir }}
        run: pnpm -C "$POLICY" install --frozen-lockfile --ignore-scripts

      # The negative control demands exit code EXACTLY 1 (blocked by
      # enforcement). A crash (exit 2) must NOT satisfy it — a crashing
      # enforcer is not a working gate (remediation review finding).
      - name: "[CANARY] Healthy fixture passes; broken control FAILS in enforcing mode"
        env:
          POLICY: ${{ steps.policy.outputs.dir }}
        run: |
          node "$POLICY/scripts/prx/check-commit.mjs" \
            "$POLICY/scripts/prx/fixtures/commit/healthy-basic.txt" --mode=enforcing
          set +e
          node "$POLICY/scripts/prx/check-commit.mjs" \
            "$POLICY/docs/verification/prx/adversarial-fixtures/commit/C08.txt" \
            --mode=enforcing >/dev/null 2>&1
          C08_EXIT=$?
          set -e
          if [ "$C08_EXIT" -ne 1 ]; then
            echo "::error::negative control C08 exited $C08_EXIT (must be exactly 1: blocked by enforcement, not a crash or a pass); failing closed"
            exit 1
          fi

      # Merge-base resolution FAILS CLOSED (remediation R2): both
      # authenticated event SHAs must exist, and resolve-range.mjs (the
      # tested module, executed directly — not a bash mirror) validates the
      # merge base is a full 40-hex SHA and an ancestor of HEAD_SHA. Any
      # failure is a red tool failure; no fallback range is ever used.
      - name: "[AUDIT] Commit range (exact event SHAs, fail-closed merge base)"
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          POLICY: ${{ steps.policy.outputs.dir }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          git -C head cat-file -e "${BASE_SHA}^{commit}"
          git -C head cat-file -e "${HEAD_SHA}^{commit}"
          MERGE_BASE=$(node "$POLICY/scripts/prx/resolve-range.mjs" \
            --repo head --base "$BASE_SHA" --head "$HEAD_SHA") || {
            echo "::error::Unable to resolve the merge base for the authenticated event SHAs"
            exit 1
          }
          {
            echo "## PRX commit audit ($TRUST)"
            echo '```'
            node "$POLICY/scripts/prx/check-commit.mjs" \
              --range "$MERGE_BASE..$HEAD_SHA" --repo head
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "[AUDIT] PR title (single-line subject rules)"
        if: github.event_name == 'pull_request'
        env:
          POLICY: ${{ steps.policy.outputs.dir }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          {
            echo "## PRX title audit ($TRUST)"
            echo '```'
            printf '%s\n' "$PR_TITLE" | node "$POLICY/scripts/prx/check-commit.mjs" -
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "[AUDIT] PR body (live-template schema) + prose extraction"
        if: github.event_name == 'pull_request'
        env:
          POLICY: ${{ steps.policy.outputs.dir }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > pr-body.md
          {
            echo "## PRX body audit ($TRUST)"
            echo '```'
            node "$POLICY/scripts/prx/check-body.mjs" pr-body.md \
              --extract-prose pr-prose.md
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "[STYLE] Vale (pinned + checksum-verified from the trusted lock; advisory)"
        if: github.event_name == 'pull_request'
        env:
          POLICY: ${{ steps.policy.outputs.dir }}
        run: |
          LOCK="$POLICY/docs/verification/prx/vale-lock.json"
          URL=$(jq -r '.assets.linux_64.url' "$LOCK")
          SHA=$(jq -r '.assets.linux_64.sha256' "$LOCK")
          VERSION=$(jq -r '.version' "$LOCK")
          curl -sSfL -o vale.tgz "$URL"
          echo "$SHA  vale.tgz" | sha256sum -c -
          tar xzf vale.tgz vale
          echo "vale $VERSION ($SHA) verified" | tee -a "$GITHUB_STEP_SUMMARY"
          # Findings are advisory in every mode (style layer never blocks);
          # a scanner CRASH still fails the job — vale exits 2 on internal
          # error, 1 on error-level alerts (cf. the 05-workflow-security
          # DEF-023 lesson: never let the reporting form eat the verdict).
          set +e
          VALE_OUT=$(./vale --config "$POLICY/scripts/prx/vale/.vale.ini" \
            --output=line pr-prose.md 2>&1)
          VALE_EXIT=$?
          set -e
          {
            echo "## PRX style audit (STE-inspired subset; advisory in every mode)"
            echo '```'
            printf '%s\n' "$VALE_OUT"
            echo "vale exit=$VALE_EXIT (0/1 tolerated in audit; >=2 is a crash)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$VALE_EXIT" -ge 2 ]; then exit "$VALE_EXIT"; fi
