# 13-tos-notion-context — TOS-006: the GitHub↔Notion PR contract.
#
# Every Tailered-OS-scoped PR must bind itself to its canonical Notion Project +
# Task (structured "## Notion context" block: Project, Task, Scope ID, Human
# owner, Decision class, Deployment consequence). Identifiers derive ONLY from
# config/tailered-os-control-plane.v1.json. Static and offline: no Notion API
# call, no bot, no auto-relation (the Notion GitHub Sync integration is archived
# and org-wide sync mode stays disabled). Runs on ALL PRs and no-ops in-job for
# non-Tailered-OS changes, so it is safe to mark Required in branch protection
# without stranding Dime PRs.
#
# `types` includes `edited` because the failure this gate catches lives in the
# PR BODY — the fix is editing the description, which must re-trigger the check.
#
# Security: the PR body is author-controlled input. It reaches the runner ONLY
# through `env:` (never `${{ }}` inside `run:` — template-injection class) and
# is parsed by a node script, not by the shell.
name: 13-tos-notion-context

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: tos-context-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tos-notion-context:
    name: 13-tos-notion-context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: "[STEP] Changed files — offline, from git (no API)"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$(git merge-base "$BASE_SHA" "$HEAD_SHA")" "$HEAD_SHA" > changed-files.txt
          echo "changed files: $(wc -l < changed-files.txt)"

      - name: "[STEP] Notion-context contract (body via env only; scope decided in-job)"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > pr-body.txt
          node scripts/ci/tos-notion-context.mjs --body-file pr-body.txt --changed-files changed-files.txt

      - name: "[STEP] Committed one-shot ledger integrity (hash-chain re-derivation)"
        run: node scripts/ci/tos-ledger-verify.mjs
