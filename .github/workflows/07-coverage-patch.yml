# 07-coverage-patch — native patch-coverage gate: >=90% on changed
# server/shared lines, 100% on money/auth paths (scripts/check-patch-coverage.mjs).
# Fail-closed: a missing/empty coverage report exits 2. Advisory at launch;
# graduates to required per docs/verification/ROLLOUT.md after calibration.
name: 07-coverage-patch

on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: 07-coverage-patch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0 # need base for the changed-line diff

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: "[STEP] Pinned zizmor — the P05 fixture cycles execute the real workflow-security detector"
        env:
          ZIZMOR_VERSION: "1.29.0" # keep equal to 05-workflow-security.yml
        run: pipx install "zizmor==${ZIZMOR_VERSION}"

      - run: pnpm install --frozen-lockfile

      - name: "[STEP] Vitest with v8 coverage (server+shared, DB-free profile)"
        run: |
          npx vitest run --coverage --coverage.provider=v8 \
            --coverage.reporter=json --coverage.include='server/**' \
            --coverage.include='shared/**' \
            --exclude 'perf/**' \
            --reporter=default --reporter=json --outputFile=vitest-results.json || true
          node scripts/check-environment-failures.mjs --profile=ci --actor="$GITHUB_ACTOR" \
            --input=vitest-results.json --report=env-gate-report.json

      - name: "[GATE] Patch coverage floors"
        run: node scripts/check-patch-coverage.mjs
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref || 'main' }}
