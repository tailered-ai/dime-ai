id: feed-controls-2026-09-05
surface:
  name: AI Model Projections
  kind: feed
  mode: operate
  change: refine
lead: impeccable
advisors: [ui-ux-pro-max, apple-design, emil-design-eng, ecc-frontend-design-direction]
product:
  audience: Sports bettors comparing a dated slate
  single_job: Find the right game and compare its published prices
  business_goal: Fast trustworthy scanning and deliberate access to details
  evidence: [Owner September 5 eight browser comments]
content:
  source: [client/src/pages/DimeModelFeed.tsx, client/src/components/projections]
  responsible_gaming: true
  invented_claims: false
law:
  - design-system/dime-ai/pages/ai-model-projections.md
  - design-system/dime-ai/MASTER.md
  - dime-ai/THREE-COLOR-LAW.md
  - design-system/dime-ai/TYPOGRAPHY.md
direction:
  adjectives: [compact, ordered, precise, calm]
  anti_references: [uneven table-versus-summary rows, ornamental edge badges, oversized empty cards]
  signature_element: A balanced slate toolbar above consistent compact comparison cards
engineering:
  stack: React + Vite + tRPC + Express
  component_reuse_first: true
  viewports: [375x812, 768x1024, 1024x768, 1272x827, 1440x900]
  reduced_motion: required
  dark_and_light: required
acceptance:
  required_states: [loading, empty, error, hover, focus, keyboard, date-change, filter-change]
  no_console_errors: true
  no_horizontal_overflow: true
  motion_gate: required
  delivery_gate: MASTER checklist and complete evidence
