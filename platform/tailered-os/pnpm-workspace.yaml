packages:
  - cloudflare-os/packages/workshop-shared
  - cloudflare-os/packages/error-reporting
  - packages/*

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# GHSA-4cwx-7wf7-3272 / CVE-2026-13697 (high) + GHSA-jr45-8vmc-qm54 (medium):
# miniflare@5.20260730.0-alpha pins undici exactly to the vulnerable 7.28.0, so an
# in-range update cannot reach the first patched release (7.29.0), and bumping
# @cloudflare/vitest-pool-workers would move miniflare/workerd off the pinned
# upstream's tested toolchain. Selector-scoped so only the vulnerable resolution is
# rewritten. Drop this once the upstream pin advances past a miniflare that pins
# undici >= 7.29.0.
overrides:
  undici@7.28.0: 7.29.0
